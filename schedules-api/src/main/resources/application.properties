server.port=${SERVER_PORT:8080}
spring.application.name=schedules-api

# Database
spring.datasource.url=${SCHEDULING_DB_URL}
spring.datasource.username=${SCHEDULING_DB_USERNAME}
spring.datasource.password=${SCHEDULING_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SCHEDULING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SCHEDULING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=scheduling

# Observability / OpenTelemetry
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.rabbit.enabled=${SCHEDULING_RABBIT_HEALTH_ENABLED:false}
management.tracing.enabled=${OTEL_TRACES_ENABLED:true}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=${SCHEDULING_RABBIT_LISTENER_ENABLED:false}

# Outbox
outbox.poll-interval=2000
