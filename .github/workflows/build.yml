name: Build and Test

on:
  push:
    branches: [develop, 'feat/*', 'fix/*', 'hu-*']
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: design-software-develop
          POSTGRES_USER: design_software_user
          POSTGRES_PASSWORD: ci_local_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Checkout design-software-scheduling-db
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/design-software-scheduling-db
          # The service feature branch is not required to exist in the DB repo.
          # Use the shared develop schema branch for reproducible service PR checks.
          ref: develop
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: design-software-scheduling-db

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Apply scheduling schema (Liquibase)
        run: |
          docker run --rm --network host \
            -v "$PWD/design-software-scheduling-db:/work" \
            --workdir /work \
            --entrypoint liquibase \
            liquibase/liquibase:4.33 \
            --search-path=/work \
            --changeLogFile=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/design-software-develop \
            --username=design_software_user \
            --password=ci_local_pw \
            update

      - name: Build and Test
        env:
          SCHEDULING_DB_URL: jdbc:postgresql://localhost:5432/design-software-develop
          SCHEDULING_DB_USERNAME: design_software_user
          SCHEDULING_DB_PASSWORD: ci_local_pw
          SCHEDULING_JPA_DDL_AUTO: none
          SCHEDULING_JPA_SHOW_SQL: 'false'
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: '5672'
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest
        run: |
          mvn -B clean verify
